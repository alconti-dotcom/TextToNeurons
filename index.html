Parser-safe placement rules:
1. The parser deletes a symbol that stands alone as a word at the START or END of a line, and deletes a line made only of symbols. Never rely on those positions. Never start a line with a bare "= " or "+ " or "@ " followed by a space.
2. A symbol survives only (a) in the MIDDLE of a short plain phrase with no entity trigger ("heat → light"), or (b) GLUED with no space to the front of the first word of a plain line: "↑Pressure", "→Expansion", "⚠Risk", "⚙Mechanism", "=Process Worked". After a glued symbol, hyphen-glue a multi-word label: "↓Blood-Sugar".
3. If the line is an entity line (digits, a Title Case phrase, a dictionary noun), a symbol on it would be cut away and lost. Skip it there. The nesting already shows the relation, and a cue label from section 6 (Aka, Eg, Result) can carry the meaning instead.
4. Never put a symbol between two entities on one line. It vanishes and they become siblings. Nest them instead.
5. A symbol before a number is lost too. Write comparisons as a plain word line above the number ("Above", then nested "2 g").
6. Do not decorate every line. Use a symbol only when it replaces words. Never use stray symbols such as $ or random emoji.
ASCII mode ("SYMBOLS: ascii", PDF-safe): use only = + & @ < > w/ w/o e.g. i.e. and the arrows -> <- <->, and only in the middle of a phrase. Replace everything else with a short word (inc, dec, yes, no) and use no emoji.

### 10. Silent quality check before you output
Verify each point, fix any failure, then output:
1. Line 1 is "# Title". No heading deeper than "####". No blank line inside a tree. Indentation is exactly 2 spaces per level.
2. No line ends with a colon. No line contains a comma, semicolon, colon, dash or parenthesis. No line has a rule trigger word. No line is a sentence or over 9 words.
3. No line mixes a digit with a non-unit word. No lone-letter line. No line begins or ends with a small word.
4. Every named item is ONE box with its facts as a chain or child labels beneath it. No item's facts are scattered across separate headings.
5. No duplicate box under the same parent. No orphan stub that belongs to a neighbor. No fragment that only makes sense with the line above.
6. Every fact, number, unit, name, example and warning in the source appears exactly once at the correct parent. Child counts match any count the source states. No fact is reversed.
7. Spelling, capitalization and abbreviations are consistent and correct. No typos, no stray symbols, no extra main branches.
8. The same kind of fact uses the same cue label everywhere.
